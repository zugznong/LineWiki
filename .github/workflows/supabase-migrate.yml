name: Supabase Database Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "MIGRATE" to confirm database schema update'
        required: true
        default: ''

jobs:
  supabase_migrate:
    name: Apply migrations to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Secrets and Input
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_INPUT" != "MIGRATE" ]; then
            echo "::error::Migration was not confirmed. You must type 'MIGRATE' in the confirm input field."
            exit 1
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Missing one or more required Supabase secrets in GitHub Repository Secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, or SUPABASE_DB_PASSWORD."
            exit 1
          fi
          echo "All validation checks passed."

      - name: Link and Push Migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "=== 로컬 마이그레이션 파일 일체 확인 ==="
          if [ -d "supabase/migrations" ]; then
            ls -l supabase/migrations/
          else
            echo "supabase/migrations 디렉토리가 감지되지 않았습니다."
          fi

          echo "Linking to Supabase project..."
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --non-interactive

          echo "=== Push 진행 전 마이그레이션 반영 상태 조회 ==="
          supabase migration list --password "$SUPABASE_DB_PASSWORD" --non-interactive || echo "마이그레이션 리스트 획득 에러"

          echo "Pushing database migrations..."
          supabase db push --password "$SUPABASE_DB_PASSWORD" --non-interactive

          echo "=== Push 완료 후 최신 마이그레이션 반영 상태 조회 및 검증 ==="
          MIG_LIST=$(supabase migration list --password "$SUPABASE_DB_PASSWORD" --non-interactive || echo "")
          echo "$MIG_LIST"

          echo "=== 연구 트리 전용 마이그레이션 (0016~0019) 최종 배포 검증 ==="
          for target_mig in "0016" "0017" "0018" "0019"; do
            if echo "$MIG_LIST" | grep -q "$target_mig"; then
              echo "✅ 마이그레이션 $target_mig 적용 확인 완료."
            else
              echo "❌ 경고: 마이그레이션 $target_mig (연구 트리용 핵심 스키마)가 원격 DB 반영 상태에서 확인되지 않습니다. 검토 수동 보완을 해주십시오."
            fi
          done
