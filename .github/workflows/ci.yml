name: Continuous Integration & E2E Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run nightly at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      run_all_stockfish:
        description: 'Run heavy Stockfish and Slow-Stockfish E2E tests'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci_verify:
    name: Run Integrated CI Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack & Prepare Pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers with Deps
        run: npx playwright install chromium --with-deps

      - name: Run Core & Quick E2E Test Suite (test:verify)
        run: pnpm run test:verify

      - name: Run Heavy & Slow Stockfish E2E Suites (Nightly / Manual)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_all_stockfish == 'true') }}
        run: |
          pnpm run test:e2e:stockfish
          pnpm run test:e2e:stockfish:slow

      - name: Gather and Upload Test Artifacts (Traces & Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ci-traces-and-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
